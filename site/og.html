<!doctype html>
<!-- Link-preview card (1200×630), rendered to img/og.png by scripts/site-shots.mjs. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html {
      overflow: hidden;
      scrollbar-gutter: auto;
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      position: relative;
    }
    .brand-row {
      position: absolute;
      left: 72px;
      top: 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .title {
      position: absolute;
      left: 72px;
      top: 150px;
      margin: 0;
      font-size: 58px;
      line-height: 1.14;
      letter-spacing: -0.025em;
    }
    .foot-line {
      position: absolute;
      left: 72px;
      bottom: 64px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 24px;
      color: var(--text-2);
    }
    .foot-line kbd {
      font-size: 19px;
    }
    .shot {
      position: absolute;
      left: 640px;
      top: 360px;
      width: 600px;
    }
  </style>
</head>
<body>
  <div class="brand-row"><img src="img/logo.png" alt="" width="48" height="48" />GeniusClip</div>
  <h1 class="title">
    <span>Your game is already recorded.</span>
    <span class="muted">Just decide what to keep.</span>
  </h1>
  <p class="foot-line"><span class="keys"><kbd>Alt</kbd><kbd>F8</kbd></span><span>Free for Windows · GPL-3.0</span></p>
  <div class="frame shot"><img src="img/screens/en-home.webp" alt="" width="1200" height="780" /></div>
</body>
</html>
