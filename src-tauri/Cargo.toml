[package]
name = "geniusclip"
description = "GeniusClip — instant replay clip recorder"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin on Windows.
name = "geniusclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
geniusclip-engine = { path = "../crates/engine" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-drag = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
# Plus the registry, for the Windows version and CPU name in problem reports,
# and ETW and the local groups, for the in-game frame rate (see `fps`).
windows = { workspace = true, features = [
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security_Authentication_Identity",
] }
# Direct2D points (the in-game stats' graph); already in the tree via windows.
windows-numerics = "0.3"
# NVML (GPU temperature), loaded only when an NVIDIA driver is present.
libloading = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
# Problem reports (already in the tree through the updater; deflate only).
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The versions Tauri already uses: a smaller async runtime, and WebView2
# calls (suspending the hidden in-game menu) on the webview Tauri hands out.
tokio = { version = "1", features = ["rt-multi-thread"] }
webview2-com = "0.38"
windows-core-webview2 = { package = "windows-core", version = "0.61" }
