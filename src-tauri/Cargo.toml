[package]
name = "geniusclip"
description = "GeniusClip — instant replay clip recorder"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin on Windows.
name = "geniusclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
geniusclip-engine = { path = "../crates/engine" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-drag = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
windows.workspace = true
# NVML (GPU temperature), loaded only when an NVIDIA driver is present.
libloading = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
